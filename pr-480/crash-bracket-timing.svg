</style>
<rect width="100%" height="100%" fill="#0f1115"/>
<text x="250" y="42" class="title">D1 · 104f4bcd — node-a&#x27;s slot-6 request raises while node-b is mid-hang on slot 2</text>
<text x="250" y="74" class="sub">The endpoint except block calls _stop.set() directly (L553). stop_and_finalize has not run, so _shutdown_bracket</text>
<text x="250" y="102" class="sub">is still None when node-b&#x27;s hang settles.</text>
