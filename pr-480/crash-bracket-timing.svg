<text x="682.0" y="1052" class="gap-lbl" text-anchor="middle">largest node-b row gap = 5.0 s (row timestamps = request midpoints)</text>
<text x="250" y="1144" class="note">node-b now sees B = 7 on exit: files 3–6 as one sample_schedule_overrun range, then polls seq 7 at t ≈ 10.3 s.</text>
<text x="250" y="1173" class="note">missed_sample_ranges = node-b seq 3–6 (sample_schedule_overrun). Every node-b slot up to B is a row or a range;</text>
<text x="250" y="1202" class="note">the only unexplained gap is node-a&#x27;s, and COLLECTOR_EXCEPTION is on the manifest.</text>
<text x="250" y="1231" class="note">publication_valid is False in both panels (COLLECTOR_EXCEPTION is fatal). The difference is whether the manifest</text>
<text x="250" y="1260" class="note">describes the outage or hides it.</text>
