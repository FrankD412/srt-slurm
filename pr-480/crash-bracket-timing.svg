<line x1="382.0" y1="361" x2="982.0" y2="361" class="gap" marker-start="url(#tick)" marker-end="url(#tick)"/>
<text x="682.0" y="386" class="gap-lbl" text-anchor="middle">largest node-b row gap = 5.0 s (row timestamps = request midpoints)</text>
<text x="250" y="478" class="note">node-a&#x27;s thread is gone after the raise: no bracket poll from it, its last slot is 5 — correct, and</text>
<text x="250" y="507" class="note">COLLECTOR_EXCEPTION says why.</text>
<text x="250" y="536" class="note">node-b leaves its loop, reads _shutdown_bracket → None → takes the fallback (L524-526): brackets at its own</text>
<text x="250" y="565" class="note">counter, seq 3, at t ≈ 10.3 s.</text>
<text x="250" y="594" class="note">Slots 3–6 on node-b have no row and no missed range: missed_sample_ranges = (empty). The manifest reads as if</text>
<text x="250" y="623" class="note">node-b was fine until it stopped at slot 3.</text><text x="250" y="708" class="title">D2 · with _request_stop — same crash, every _stop path arms the bracket first: B = floor(6.1/1)+1 = 7</text>
<text x="250" y="740" class="sub">The except block calls _request_stop(now) instead of _stop.set(); it computes the shared bracket under the state</text>
<text x="250" y="768" class="sub">lock, then sets _stop. The None fallback becomes unreachable and raises.</text>
